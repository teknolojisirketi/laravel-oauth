services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ../:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app_network

  php:
    build: php/8.3
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

  worker:
    build: php/8.3
    restart: unless-stopped
    command: supervisord -n -c /etc/supervisor/conf.d/supervisord.conf
    volumes:
      - ../:/var/www/html
      - ./worker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel_oauth}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laravel} -d ${POSTGRES_DB:-laravel_oauth}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - app_network

networks:
  app_network:
    name: ${DOCKER_NETWORK}
    driver: ${DOCKER_NETWORK_DRIVER:-bridge}

volumes:
  pg_data: {}
